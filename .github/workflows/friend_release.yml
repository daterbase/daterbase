# 친구용 PC 설치 파일만 이 공개 저장소 릴리스로 옮겨 둠 (옛 PC 자동 업데이트 주소 유지).
# 개인용 설치 파일(Daterbase-Setup*)은 절대 올리지 않음.
name: friend-release
on:
  workflow_dispatch:
    inputs:
      tag: { description: "릴리스 태그 (예: pc-v0.9.17)", required: true }
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: 친구용 파일 받기
        env:
          GH_TOKEN: ${{ secrets.SRC_TOKEN || github.token }}
        run: |
          mkdir out && cd out
          gh release download "${{ inputs.tag }}" -R daterbase/daterbase-app \
            -p 'Daterbase-Friend-Setup*' -p 'friend.yml' \
          || gh release download "${{ inputs.tag }}" -R daterbase/daterbase \
            -p 'Daterbase-Friend-Setup*' -p 'friend.yml'
          ls -la
          if ls | grep -q '^Daterbase-Setup'; then echo "개인용 파일이 섞였어요"; exit 1; fi
      - name: 이 저장소 릴리스로 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          gh release view "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release upload "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" --clobber * \
            || gh release create "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" --title "Daterbase PC ${{ inputs.tag }}" --notes "Daterbase PC 친구용" --latest *
