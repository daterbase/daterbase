<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Daterbase 안내</title>
<link rel="icon" href="../favicon.svg">
<style>
:root{--bg:#f6f4f0;--card:#fff;--fg:#26231f;--mut:#78726a;--line:#e6e1d9;--ac:#5b5bd6;--ac2:#eeeefc;--warn:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#18171a;--card:#222126;--fg:#eceae6;--mut:#a29d96;--line:#34323a;--ac:#9a9af0;--ac2:#2a2a44;--warn:#fb923c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--ac)}
#gate{min-height:100vh;display:grid;place-items:center;padding:16px}
.gbox{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;text-align:center}
.gbox h1{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}.gbox p{margin:0 0 18px;color:var(--mut);font-size:14px}
.gbox form{display:flex;gap:8px}
.gbox input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;background:var(--bg);color:var(--fg)}
.gbox button{height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--fg);color:var(--bg);font:600 15px/1 inherit;cursor:pointer}
.gerr{color:var(--warn)!important;margin:10px 0 0!important;min-height:1.4em}
main{max-width:860px;margin:0 auto;padding:24px 16px 80px}
.hero{text-align:center;padding:40px 0 24px}
.kicker{margin:0;color:var(--mut);font-size:14px;letter-spacing:.06em}
.hero h1{margin:4px 0 10px;font-size:clamp(40px,9vw,64px);line-height:1;letter-spacing:-.04em}
.lead{margin:0 0 22px;color:var(--mut)}
.cta{display:inline-block;padding:12px 26px;border-radius:99px;background:var(--fg);color:var(--bg);font-weight:700;text-decoration:none}
.url{margin:10px 0 0;font-size:13px;color:var(--mut)}
.toc{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin:8px 0 10px;background:var(--bg);scrollbar-width:none}
.toc a{flex:none;padding:6px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);font-size:14px;text-decoration:none}
section{padding-top:28px}
h2{margin:0 0 14px;font-size:24px;letter-spacing:-.02em}
h3{margin:0 0 6px;font-size:17px}
figure{margin:0 0 16px}
figure img{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line);background:var(--card)}
figcaption{margin-top:6px;color:var(--mut);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.phone-row{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:center}
.phone img{border-radius:22px}
.feat{margin:0;padding-left:18px}.feat li{margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:0 0 12px}
.card p{margin:6px 0 0}
ol,ul{margin:6px 0 0;padding-left:20px}li{margin:4px 0}
.hint{color:var(--mut);font-size:14px;margin:8px 0 0}
.warn{color:var(--warn);font-size:15px;margin:10px 0 0}
.k{display:inline-block;min-width:1.6em;padding:0 5px;border:1px solid var(--line);border-radius:6px;text-align:center;font-size:13px;line-height:1.5}
code{padding:1px 6px;border-radius:6px;background:var(--ac2);font-size:.92em}
.opt{display:inline-block;margin-left:6px;padding:1px 9px;border-radius:99px;background:var(--ac2);color:var(--ac);font-size:12px;font-weight:600;vertical-align:middle}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 10px}
.step .n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--fg);color:var(--bg);font-weight:700;font-size:15px;line-height:1}
.step p{margin:4px 0 0}
.sub{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--bg)}
.notes li{margin:8px 0}
.gwarn{margin:14px 0 0;padding:14px 16px;border-radius:12px;background:var(--bg)}.gwarn p{margin:0}
.gmock{position:relative;max-width:360px;margin:12px 0;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:13px}
.gm-ic{color:#d93025;font-size:22px;line-height:1}.gm-t{margin:6px 0 4px;font-size:17px;font-weight:600}.gm-p{color:var(--mut)}
.gm-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.gm-adv{color:#1a73e8;font-weight:600;outline:2px solid #f59e0b;outline-offset:3px;border-radius:4px}.gm-btn{padding:6px 12px;border-radius:6px;background:#1a73e8;color:#fff}
.gm-go{margin-top:12px;color:#1a73e8;text-decoration:underline;outline:2px solid #f59e0b;outline-offset:3px;border-radius:4px;display:inline-block}
.gmock i{font-style:normal;color:#f59e0b;font-weight:700}

@media (max-width:640px){.two,.phone-row{grid-template-columns:1fr}.phone{max-width:240px;margin:0 auto}.step{grid-template-columns:1fr}.hero{padding-top:24px}}
</style></head>
<body>
<div id="gate"><div class="gbox"><h1>Daterbase</h1><p>초대받은 분만 볼 수 있어요</p>
<form id="gf"><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" autofocus><button>열기</button></form><p class="gerr" id="ge"></p></div></div>

const b64=(s)=>Uint8Array.from(atob(s),(c)=>c.charCodeAt(0));
async function open_(pw){const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",!1,["deriveKey"]);const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},!1,["decrypt"]);const out=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},k,b64(P.d));return new TextDecoder().decode(out)}
async function show(pw,save){try{const h=await open_(pw);const m=document.getElementById("doc");m.innerHTML=h;m.hidden=!1;document.getElementById("gate").remove();if(save)try{sessionStorage.setItem("dbg_pw",pw)}catch(_){}if(location.hash){const t=document.querySelector(location.hash);t&&t.scrollIntoView()}return!0}catch(e){return!1}}
document.getElementById("gf").addEventListener("submit",async(e)=>{e.preventDefault();const v=document.getElementById("pw").value;const er=document.getElementById("ge");er.textContent="여는 중…";if(!(await show(v,!0)))er.textContent="비밀번호가 맞지 않아요"});
