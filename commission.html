<style>/* everything below is sized in rem, so the whole app scales with this one fluid value */
html{font-size:calc(clamp(14.5px,calc(13.2px + .22vw),17.5px) * var(--fs,1))}

@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:url("./PretendardVariable-cbkeext3.woff2") format("woff2-variations"),url("./PretendardVariable-cbkeext3.woff2") format("woff2")}
/* Layout: a movie theater — dark house, marquee-bulb header, ticket-stub schedule rows, posters on the wall, velvet sidebar */
:root{
  --paper:#0e0c11; --sheet:#1a171f; --ink:#f3ede2; --ink-2:#a8a199; --rule:#2e2a35;
  --pink:#e8b64c; --pink-soft:#3a2f17; --on-accent:#1a1406; --blue:#8fb0ff; --blue-soft:#1d2440;
  --ok:#74d6a2; --ok-soft:#14301f; --warn:#f2bd68; --warn-soft:#382a14; --bad:#ff7676; --mute-soft:#25222b;
  --curtain:#7a1424; --curtain-2:#4a0b16; --screen:#fffaf0;
  --body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --display:var(--body);
  --mono:var(--body);
  --marquee:"Pretendard Variable",Pretendard,Impact,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --paper:#f7f7f8; --sheet:#ffffff; --ink:#3e3e46; --ink-2:#888896; --rule:#e1e1e5;
  --pink:#b3203a; --pink-soft:#f6dde2; --on-accent:#ffffff; --blue:#2f5bd3; --blue-soft:#e3eafb;
  --ok:#1f7a50; --ok-soft:#dcf1e6; --warn:#a8600c; --warn-soft:#fbecd8; --bad:#c23a3a; --mute-soft:#ececee;
  --curtain:#9c1b2f; --curtain-2:#6e1020; --screen:#ffffff; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:0.9375rem;line-height:1.55;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:45rem;margin:0 auto;padding-inline:1rem;padding-block:0 6.875rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.top{position:sticky;top:0;z-index:5;background:var(--paper);padding-block:calc(0.875rem + env(safe-area-inset-top,0px)) 0.625rem;margin-inline:-1rem;padding-inline:1rem;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:0.75rem}
.brand h1{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.01em;margin:0;line-height:1}
.brand h1 span{color:var(--pink)}
.today{font-size:0.75rem;color:var(--ink-2)}
.ledger{display:grid;grid-template-columns:repeat(2,1fr);gap:0.5rem;margin-top:0.75rem}
.ledger div{background:var(--sheet);border:1px solid var(--rule);border-radius:0.625rem;padding:0.5rem 0.625rem;min-width:0}
.ledger small{display:block;font-size:0.6875rem;color:var(--ink-2);letter-spacing:.04em}
.ledger b{font-family:var(--mono);font-weight:700;font-size:1.0625rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger button{background:none;border:0;padding:0;font:inherit;text-align:left;width:100%}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-top:1px solid var(--rule);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:45rem}
nav.tabs button{background:none;border:0;padding:0.625rem 0 0.75rem;font-size:0.75rem;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:1.375rem;height:1.375rem;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="true"]{color:var(--pink);font-weight:600}
.fab{position:fixed;right:max(1rem,calc(50% - 21.5rem));bottom:calc(4.75rem + env(safe-area-inset-bottom,0px));z-index:6;background:var(--pink);color:var(--on-accent);border:0;border-radius:62.4375rem;padding:0.75rem 1.125rem;font-weight:600;box-shadow:0 0.375rem 1.125rem color-mix(in srgb,var(--pink) 35%,transparent)}

h2.sec{font-family:var(--display);font-weight:700;font-size:1.125rem;letter-spacing:-.01em;margin:1.375rem 0 0.5rem;display:flex;justify-content:space-between;align-items:baseline;gap:0.5rem}
h2.sec .meta{font-family:var(--body);font-size:0.75rem;color:var(--ink-2)}
.list{display:flex;flex-direction:column;gap:0.5rem}
.job{display:grid;grid-template-columns:3.875rem 1fr auto;gap:0.75rem;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:0.75rem;padding:0.625rem 0.75rem;text-align:left;width:100%}
.job .dd{font-family:var(--mono);font-size:0.8125rem;text-align:center;line-height:1.2}
.job .dd b{display:block;font-size:0.9375rem}
.job .dd.late b{color:var(--bad)} .job .dd.soon b{color:var(--pink)}
.job .who{min-width:0}
.job .who strong{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .who small{color:var(--ink-2);font-size:0.75rem}
.job .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:0.25rem}
.job .r .num{font-size:0.8125rem;color:var(--ink-2)}
.pill{display:inline-block;font-size:0.6875rem;font-weight:600;padding:2px 0.5rem;border-radius:62.4375rem;white-space:nowrap;background:var(--mute-soft);color:var(--ink-2)}
.s-예약{background:var(--blue-soft);color:var(--blue)}
.s-신청확인,.s-입금확인{background:var(--warn-soft);color:var(--warn)}
.s-러프,.s-중간확인완료{background:var(--pink-soft);color:var(--pink)}
.s-완성본전송{background:var(--ok-soft);color:var(--ok)}
.s-취소{text-decoration:line-through}
.rowtrack{display:flex;gap:0.375rem;overflow-x:auto;padding-bottom:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:0.25rem;background:var(--mute-soft);border-radius:0.6875rem;padding:0.25rem;max-width:32.5rem}
.seg button{border:0;background:none;border-radius:0.5rem;padding:0.5625rem 0.625rem;font-weight:500;color:var(--ink-2);font-size:0.875rem}
.seg button[aria-selected="true"]{background:var(--sheet);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(20,30,50,.12)}
.seg .num{font-size:0.75rem;color:var(--pink);margin-left:2px}
.tile .cap small .pill{font-size:0.625rem;padding:1px 0.375rem;margin-right:2px}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:62.4375rem;padding:0.3125rem 0.75rem;font-size:0.8125rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.empty{border:1.5px dashed var(--rule);border-radius:0.75rem;padding:1.375rem;text-align:center;color:var(--ink-2);font-size:0.875rem}
.search{width:100%;margin-top:0.875rem;padding:0.625rem 0.75rem;border:1px solid var(--rule);border-radius:0.625rem;background:var(--sheet)}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:1.125rem 0 0.625rem}
.calhead b{font-family:var(--display);font-weight:700;font-size:1.3125rem;font-variant-numeric:tabular-nums}
.calhead button{background:var(--sheet);border:1px solid var(--rule);border-radius:0.5rem;width:2.375rem;height:2.125rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--rule);border-left:1px solid var(--rule);background:var(--sheet);border-radius:0.5rem;overflow:hidden}
.cal .h{font-size:0.6875rem;text-align:center;padding:0.25rem 0;color:var(--ink-2);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.cal .h:first-child{color:var(--bad)}
.cal .d{min-height:4.875rem;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:3px;min-width:0;display:flex;flex-direction:column;gap:2px}
.cal .d.out{background:var(--paper)}
.cal .d .n{font-family:var(--mono);font-size:0.6875rem;color:var(--ink-2)}
.cal .d.today .n{color:var(--on-accent);background:var(--pink);border-radius:62.4375rem;width:1.25rem;text-align:center}
/* calendar tag: name on top, thumbnail underneath at the tag's full width */
.cal .d button{font-size:0.6875rem;border:0;border-radius:0.3125rem;padding:2px 3px 3px;text-align:left;white-space:nowrap;overflow:hidden;width:100%;display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0}
.cal .d button span{overflow:hidden;text-overflow:ellipsis;min-width:0;padding:0 1px}
/* items in a day: 1 column on phone, 2 side by side on wider screens */
.cal .d .items{display:grid;grid-template-columns:minmax(0,1fr);gap:3px;align-items:start}
/* one item per line at every width (thumbnails removed) */
/* thumbnail fills its column width and scales with the window; original proportions kept */
.cal .d button .cthumb{display:block;width:100%;height:auto;border-radius:3px}

/* gallery */
/* left-to-right grid in time order; every image keeps its own ratio */
/* 3 columns on tablet/PC (2 on phone), widths follow the window; landscape images take 1.5 columns */
/* justified rows: every row is filled edge to edge; script sets each tile width from its image ratio */
.gal{display:flex;flex-wrap:wrap;gap:0.625rem;align-items:flex-start}
.gal>.tile{--r:.719;flex:0 0 auto;width:calc((100% - 0.625rem)/2);min-width:0}
.tile{width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:0.75rem;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.tile .pic{display:block;width:100%;height:auto;aspect-ratio:var(--r)}
.tile .ph{aspect-ratio:var(--r);width:100%;background:repeating-linear-gradient(135deg,var(--paper) 0 0.5rem,var(--sheet) 0.5rem 1rem);display:grid;place-items:center;color:var(--ink-2);font-size:0.75rem;overflow:hidden}
.tile .ph img{width:100%;height:100%;object-fit:cover}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--paper);width:100%;max-width:45rem;max-height:92%;overflow-y:auto;border-radius:1.125rem 1.125rem 0 0;padding:1rem 1rem calc(1.5rem + env(safe-area-inset-bottom,0px))}

.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0.625rem}

.upl{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;margin-top:0.625rem}

.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.25rem;margin-top:0.625rem;padding:1.625rem 1rem;border:2px dashed var(--rule);border-radius:0.75rem;background:var(--sheet);text-align:center;cursor:pointer;transition:border-color .15s,background .15s}

.foot{display:flex;gap:0.5rem;justify-content:space-between;margin-top:1.125rem;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8.125rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:0.5625rem 1rem;border-radius:62.4375rem;font-size:0.8125rem;z-index:30}

.brandmeta{display:flex;align-items:center;gap:0.5rem}

.preview{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;margin-top:0.875rem;padding:0.75rem;border:1px solid var(--rule);border-radius:0.75rem;background:var(--sheet)}

.tile .cap .l1,.tile .cap .l2{display:flex;justify-content:space-between;gap:0.375rem;min-width:0}

.pill.same{background:var(--blue-soft);color:var(--blue);font-size:0.6562rem;vertical-align:2px;margin-left:0.25rem}

.clients{display:flex;flex-direction:column;gap:0.75rem}
.client{background:var(--sheet);border:1px solid var(--rule);border-radius:0.875rem;padding:0.75rem}

.steps .stedit{border-style:dashed;color:var(--ink-2)}

}

<script>/* Local replacement for the claude.ai db / assets / downloads runtime: everything is stored on this device (IndexedDB). */
(function(){
const DB="planner-commission";let idb=null,ready=null;
const mem={},subs=[],urls={};
const BR=(()=>{try{return window.parent!==window&&window.parent.__cmBridge||null}catch(e){return null}})();
const clone=v=>v===undefined?v:JSON.parse(JSON.stringify(v));
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("docs");d.createObjectStore("blobs")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const st=(n,m)=>idb.transaction(n,m).objectStore(n);
const req=q=>new Promise((res,rej)=>{q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const all=n=>new Promise((res,rej)=>{const out=[];const q=st(n,"readonly").openCursor();q.onsuccess=()=>{const c=q.result;if(c){out.push([c.key,c.value]);c.continue()}else res(out)};q.onerror=()=>rej(q.error)});
const init=()=>ready||(ready=(async()=>{
  idb=await open();
  for(const [k,v] of await all("docs")){const i=k.indexOf("/");(mem[k.slice(0,i)]=mem[k.slice(0,i)]||{})[k.slice(i+1)]=v}
  for(const [k,v] of await all("blobs")){try{urls[k]=URL.createObjectURL(v)}catch(e){}}
  if(BR){try{mem.commissions={};BR.jobs().forEach(j=>{const{id,...d}=j;mem.commissions[id]=JSON.parse(JSON.stringify(d))});mem.templates={};BR.tpls().forEach(t=>{const{id,...d}=t;mem.templates[id]=JSON.parse(JSON.stringify(d))});const c=BR.cfg();if(c&&Object.keys(c).length)(mem.settings=mem.settings||{}).main=JSON.parse(JSON.stringify(c))}catch(e){console.error(e)}}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})());
const snapDoc=(coll,id)=>{const d=(mem[coll]||{})[id];return{id,exists:d!==undefined,data:()=>clone(d)}};
const snapColl=(coll,order)=>{let ids=Object.keys(mem[coll]||{});
  let docs=ids.map(id=>({id,data:()=>clone(mem[coll][id])}));
  if(order)docs.sort((a,b)=>{const x=a.data()[order],y=b.data()[order];return x===y?0:(x==null?1:y==null?-1:x<y?-1:1)});
  return{docs,size:docs.length,empty:!docs.length,forEach:f=>docs.forEach(f)}};
const fire=coll=>subs.filter(s=>s.coll===coll).forEach(s=>{try{s.cb(s.id!=null?snapDoc(coll,s.id):snapColl(coll,s.order))}catch(e){console.error(e)}});
const subscribe=(coll,id,order,cb,err)=>{const s={coll,id,order,cb};subs.push(s);Promise.resolve().then(()=>{try{cb(id!=null?snapDoc(coll,id):snapColl(coll,order))}catch(e){console.error(e)}});return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}};
const bridged=(coll,id)=>BR&&(coll==="commissions"||coll==="templates"||(coll==="settings"&&id==="main"));
const write=async(coll,id,val)=>{(mem[coll]=mem[coll]||{})[id]=val;if(bridged(coll,id)){const v=clone(val);if(coll==="commissions")BR.setJob(id,v);else if(coll==="templates")BR.setTpl(id,v);else BR.setCfg(v)}else await req(st("docs","readwrite").put(clone(val),coll+"/"+id));setTimeout(()=>fire(coll),40)};
const remove=async(coll,id)=>{if(mem[coll])delete mem[coll][id];if(bridged(coll,id)){if(coll==="commissions")BR.delJob(id);else if(coll==="templates")BR.delTpl(id)}else await req(st("docs","readwrite").delete(coll+"/"+id));setTimeout(()=>fire(coll),40)};
const ref=(coll,id)=>({id,
  set:d=>write(coll,id,clone(d)),
  update:async p=>{const cur=(mem[coll]||{})[id];if(cur===undefined)throw Object.assign(new Error("not_found"),{code:"not_found"});await write(coll,id,{...cur,...clone(p)})},
  delete:()=>remove(coll,id),
  get:async()=>snapDoc(coll,id),
  onSnapshot:(cb,err)=>subscribe(coll,id,null,cb,err)});
const db={
  collection:coll=>({doc:id=>ref(coll,id),onSnapshot:(cb,err)=>subscribe(coll,null,null,cb,err),orderBy:f=>({onSnapshot:(cb,err)=>subscribe(coll,null,f,cb,err)}),get:async()=>snapColl(coll)}),
  doc:path=>{const i=path.indexOf("/");return ref(path.slice(0,i),path.slice(i+1))}};
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const assets={
  upload:async(blob,opt)=>{const id=rid();const b=new Blob([blob],{type:(opt&&opt.type)||blob.type||"application/octet-stream"});await req(st("blobs","readwrite").put(b,id));urls[id]=URL.createObjectURL(b);return{id,url:urls[id]}},
  delete:async id=>{await req(st("blobs","readwrite").delete(id));if(urls[id]){try{URL.revokeObjectURL(urls[id])}catch(e){}delete urls[id]}}};
const downloads={save:async({filename,data})=>{
  const b=data instanceof Blob?data:new Blob([data],{type:typeof data==="string"?"text/csv;charset=utf-8":"application/octet-stream"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}};
window.__blobUrl=id=>urls[id]||"";
window.__commissionStore={init,db,assets,mem,putBlob:async(id,blob)=>{await req(st("blobs","readwrite").put(blob,id));urls[id]=URL.createObjectURL(blob)},write,remove};
window.claude={use:async n=>{await init();return n==="db"?db:n==="assets"?assets:n==="downloads"?downloads:null}};
})();</script>
<script>
/* statuses are user-editable; each has a kind: active (in progress), done (sent), cancel */
/* default colors = the dropdown chip colors from the COMMISSION sheet */
const STATUS_DEFS_DEFAULT=[{name:"예약",color:"#ffe5a0",kind:"active"},{name:"신청확인",color:"#e8eaed",kind:"active"},{name:"입금확인",color:"#e6e6e6",kind:"active"},{name:"러프",color:"#fff2cc",kind:"active"},{name:"중간확인완료",color:"#5fc9a3",kind:"active"},{name:"완성본 전송",color:"#3d3d3d",kind:"done"},{name:"연교",color:"#bfe1f6",kind:"active"},{name:"취소",color:"#3d3d3d",kind:"cancel"}];
let STATUSES=STATUS_DEFS_DEFAULT.map(d=>d.name);
let ACTIVE=new Set(STATUS_DEFS_DEFAULT.filter(d=>d.kind==="active").map(d=>d.name));
let DONE=new Set(["완성본 전송"]),CANCEL=new Set(["취소"]);
const TYPES=["포스터 타입","LD 전신","LD 두상","기타"];
const TYPES_DEFAULT=["①심플","②캐릭터 중심","③배경 중심","④번외"];
let SUBTYPES=["",...TYPES_DEFAULT];
const applyTypes=list=>{SUBTYPES=["",...(Array.isArray(list)&&list.length?list:TYPES_DEFAULT)]};
const SOURCES_DEFAULT=["크레페","카톡","기타"];let SOURCES=[...SOURCES_DEFAULT];const FEE_SRC="크레페";
const applySources=l=>{SOURCES=Array.isArray(l)&&l.length?l.map(String):[...SOURCES_DEFAULT]};
const KINDS=["시안","완성본"];
const S={c:[],t:[],slots:null,tab:"list",calY:0,calM:0,q:"",galF:"all",tplFor:""};
let db=null,assets=null,downloads=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won=n=>n==null||n===""||isNaN(n)?"–":"₩"+Number(n).toLocaleString("ko-KR");
/* 작업 전 가격 = money actually received; 작업 후 가격 = what the work turned out to be worth */
const recv=c=>{const v=c.quoteBefore??c.price;return v==null||v===""||isNaN(v)?null:Number(v)};
const net=c=>{const p=recv(c);return(CANCEL.has(c.status)||!p)?0:(c.source==="크레페"?Math.round(p*0.9):p)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const pd=s=>{if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const dday=s=>{const d=pd(s);if(!d)return null;return Math.round((d-today())/864e5)};
const ddLbl=n=>n==null?"–":n===0?"D-DAY":n>0?"D-"+n:"D+"+(-n);
const md=s=>{const d=pd(s);return d?`${d.getMonth()+1}/${d.getDate()}`:""};
const pill=st=>`<span class="pill s-${esc((st||"").replace(/\s/g,""))}">${esc(st||"–")}</span>`;
const imgSrc=id=>window.__blobUrl(id);
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function store(k,v){try{v===undefined?null:localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
/* text size: per device (phone and PC can differ) */
const FS_OPTS=[["0.875","작게"],["1","보통"],["1.125","크게"],["1.25","아주 크게"]];
function applyFs(v,relayout){v=FS_OPTS.some(o=>o[0]===v)?v:"1";document.documentElement.style.setProperty("--fs",v);if(relayout)layoutGalSoon()}
applyFs(load("fs")||"1");
/* body font: synced setting — {kind:"file",id,name} (uploaded font file) or {kind:"local",name} (font installed on the device) */
const BODY_STACK='"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif';
let fontKey="";
/* movie-theater concept on/off: when off, theater words become plain words and marquee type becomes the body font */
const PLAIN_MAP=[["상영관 (어둡게)","어둡게"],["로비 (밝게)","밝게"],["상영표","일정표"],["월 개봉작","월 완료작"],["월 개봉","월 완료"],["상영 예정","진행 중"],["상영 중","완료"]];
let plainMode=false,plainObs=null;
const plainText=t=>{for(const [a,b] of PLAIN_MAP)t=t.split(a).join(b);return t};
function plainTextNode(t){const v=t.nodeValue;if(!v||!/상영|개봉|로비/.test(v))return;const p=plainText(v);if(p!==v){if(t.__orig==null)t.__orig=v;t.nodeValue=p}}
function plainNode(root){if(root.nodeType===3){plainTextNode(root);return}if(root.nodeType!==1)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const l=[];let n;while(n=w.nextNode())l.push(n);l.forEach(plainTextNode)}
function setTheater(on){const was=!plainMode;plainMode=!on;document.documentElement.classList.toggle("plain",!on);
  if(!on){plainNode(document.body);
    if(!plainObs){plainObs=new MutationObserver(ms=>{if(!plainMode)return;for(const m of ms){if(m.type==="characterData")plainTextNode(m.target);else m.addedNodes.forEach(plainNode)}});
      plainObs.observe(document.body,{childList:true,subtree:true,characterData:true})}}
  else if(!was){const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())if(n.__orig!=null){n.nodeValue=n.__orig;n.__orig=null}}}
function fontInstalled(n){try{const x=document.createElement("canvas").getContext("2d");const t="가나다라 ABCabc 123";
  return ["monospace","serif"].some(fb=>{x.font=`72px ${fb}`;const w0=x.measureText(t).width;x.font=`72px "${n.replace(/"/g,"")}", ${fb}`;return x.measureText(t).width!==w0})}catch(e){return true}}
async function applyFont(f){const key=f?JSON.stringify(f):"";if(key===fontKey)return;fontKey=key;const r=document.documentElement;
  if(!f||!f.name){r.style.removeProperty("--body");return}
  if(f.kind==="file"&&f.id){try{const buf=await (await fetch(imgSrc(f.id))).arrayBuffer();const ff=new FontFace("UserFont",buf);await ff.load();document.fonts.add(ff);r.style.setProperty("--body",`"UserFont",${BODY_STACK}`)}catch(e){r.style.removeProperty("--body")}}
  else r.style.setProperty("--body",`"${String(f.name).replace(/["\\]/g,"")}",${BODY_STACK}`)}


/* ---------- clients: one person, several jobs ---------- */
const clientOf=c=>(c.client||c.nick||"").trim();
function clientJobs(name,exceptId){return S.c.filter(x=>x.id!==exceptId&&clientOf(x)===name)}
function labelFor(client,seq,count){return `${client}님`+(count>1?` #${seq||1}`:"")}

  h+=`<div class="tbar"><div class="seg" role="tablist" style="margin-top:0.875rem;max-width:22.5rem"><button type="button" role="tab" data-lm="due" aria-selected="${LM==="due"}">마감 순</button><button type="button" role="tab" data-lm="client" aria-selected="${LM==="client"}">의뢰인별</button></div>`;
  h+=`<input class="search" id="q" type="search" placeholder="의뢰인·메모 검색" value="${esc(S.q)}">`;

    h+=`<div class="fltrow">${sel("sub","타입 전체",SUBTYPES.filter(Boolean))}${sel("src","받은 곳 전체",SOURCES)}${sel("st","상태 전체",STATUSES)}${F.sub||F.src||F.st?`<button type="button" class="chip" id="fltClr">해제</button>`:""}</div>`}h+="</div>";
  if(LM==="client"){h+=clientView(m);$("#view").innerHTML=h;wireSearch();return}
  h+=`<section class="cmpanel"><h2 class="sec">상영 예정<span class="meta">${act.length}건 · 마감 순</span></h2>`;
  h+=act.length?`<div class="jhead"><span>날짜</span><span>D-day</span><span>상태</span><span>이름</span><span>태그</span><span>받은 곳</span><span>작업 전</span><span>작업 후</span></div><div class="list tbl">${act.map(jobRow).join("")}</div>`:`<div class="empty">상영 예정인 커미션이 없어요. 아래 ＋ 새 커미션으로 추가하세요.</div>`;h+="</section>";
  keys.forEach(k=>{const g=groups[k].sort((a,b)=>(b.doneDate||b.due||"")>(a.doneDate||a.due||"")?1:-1);const tot=g.reduce((a,c)=>a+net(c),0);
    const lbl=k==="없음"?"완료일 없음":`${Number(k.slice(5))}월 개봉`;
    h+=`<section class="cmpanel"><h2 class="sec">${lbl}<span class="meta">${g.length}건 · ${k==="없음"?"수익 계산에서 빠짐":`수익 <span class="num">${won(tot)}</span>`}</span></h2><div class="jhead"><span>마감</span><span>완료</span><span>상태</span><span>이름</span><span>태그</span><span>받은 곳</span><span>작업 전</span><span>작업 후</span></div><div class="list tbl">${g.map(jobRow).join("")}</div></section>`});
  if(cancelled.length)h+=`<section class="cmpanel"><h2 class="sec">취소<span class="meta">${cancelled.length}건 · 수익 계산에서 빠짐</span></h2><div class="jhead"><span>마감</span><span>완료</span><span>상태</span><span>이름</span><span>태그</span><span>받은 곳</span><span>작업 전</span><span>작업 후</span></div><div class="list tbl">${cancelled.sort((a,b)=>(b.due||"")>(a.due||"")?1:-1).map(jobRow).join("")}</div></section>`;
  if(arch.length)h+=`<h2 class="sec">이전 작업<span class="meta">${arch.length}건</span></h2><div class="jhead"><span>마감</span><span>완료</span><span>상태</span><span>이름</span><span>태그</span><span>받은 곳</span><span>작업 전</span><span>작업 후</span></div><div class="list tbl">${arch.map(jobRow).join("")}</div>`;
  $("#view").innerHTML=h;wireSearch();

function wireSearch(){document.querySelectorAll("[data-flt]").forEach(el=>el.onchange=()=>{S.f=S.f||{};S.f[el.dataset.flt]=el.value;renderList()});
  const fc=$("#fltClr");if(fc)fc.onclick=()=>{S.f={sub:"",src:"",st:""};renderList()};
  const qi=$("#q");qi.addEventListener("input",e=>{S.q=e.target.value;const p=e.target.selectionStart;renderList();const n=$("#q");n.focus();n.setSelectionRange(p,p)})}
function clientView(m){
  const by=new Map();S.c.filter(m).forEach(c=>{const k=clientOf(c);if(!by.has(k))by.set(k,[]);by.get(k).push(c)});
  const last=g=>g.reduce((a,c)=>{const d=c.due||c.doneDate||"";return d>a?d:a},"");
  const rows=[...by.entries()].sort((a,b)=>{const ac=a[1].some(c=>ACTIVE.has(c.status)),bc=b[1].some(c=>ACTIVE.has(c.status));
    if(ac!==bc)return ac?-1:1;return last(b[1])>last(a[1])?1:last(b[1])<last(a[1])?-1:0});
  if(!rows.length)return`<div class="empty" style="margin-top:1rem">찾는 의뢰인이 없어요.</div>`;
  const repeat=rows.filter(([,g])=>g.filter(c=>!CANCEL.has(c.status)).length>1).length;
  let h=`<h2 class="sec">의뢰인<span class="meta">${rows.length}명 · 단골 ${repeat}명</span></h2><div class="clients">`;
  rows.forEach(([name,g])=>{const jobs=[...g].sort((a,b)=>(a.seq||1)-(b.seq||1)||((a.due||"")<(b.due||"")?-1:1));
    const valid=jobs.filter(c=>!CANCEL.has(c.status));const total=valid.reduce((a,c)=>a+net(c),0);
    const act=jobs.filter(c=>ACTIVE.has(c.status)).length;
    h+=`<section class="client"><header><strong>${esc(name)}님</strong>${valid.length>1?`<span class="pill regular">단골</span>`:""}<span class="meta">의뢰 ${valid.length}건 · 총 <span class="num">${won(total)}</span>${act?` · 상영 예정 ${act}`:""}</span></header><div class="list">${jobs.map(jobRow).join("")}</div></section>`});
  return h+`</div>`;
}

/* ---------- calendar ---------- */
function renderCal(){
  const y=S.calY,m=S.calM,first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());
  /* finished work sits on its completion date when it has one; everything else on its deadline */
  const calDate=c=>DONE.has(c.status)&&c.doneDate?c.doneDate:c.due;
  const byDay={};S.c.forEach(c=>{const k=calDate(c);if(k&&!CANCEL.has(c.status))(byDay[k]=byDay[k]||[]).push(c)});
  Object.values(byDay).forEach(g=>g.sort(byDayOrder));
  const tIso=iso(today());
    let h=`<div class="calhead"><button type="button" id="pm" aria-label="이전 달">‹</button><b>${y}. ${m+1}</b><button type="button" id="nm" aria-label="다음 달">›</button></div><div class="cal">`;
  "일월화수목금토".split("").forEach(d=>h+=`<div class="h">${d}</div>`);
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d);
    if(i>=35&&d.getMonth()!==m)break;
    h+=`<div class="d${d.getMonth()!==m?" out":""}${k===tIso?" today":""}${k<tIso?" past":""}" data-day="${k}"><span class="n">${d.getDate()}</span>${(byDay[k]||[]).length?`<div class="items">`:""}${(byDay[k]||[]).map(c=>`<button type="button" class="pill s-${esc(c.status.replace(/\s/g,""))}" data-open="${c.id}" data-dk="${k}" title="${esc(c.nick)}"><span>${esc(c.nick)}</span>${net(c)?`<small class="camt"><b class="full">${won(net(c))}</b><b class="short">${(net(c)/10000).toFixed(net(c)%10000?1:0).replace(/\.0$/,"")}</b></small>`:""}</button>`).join("")}${(byDay[k]||[]).length?`</div>`:""}</div>`}
  h+=`</div><p class="hint" style="margin-top:0.625rem"><span class="calu">금액 단위 만원</span> 색: <span class="pill s-예약">예약</span> <span class="pill s-입금확인">입금확인</span> <span class="pill s-중간확인완료">상영 예정</span> <span class="pill s-완성본전송">완료</span></p>`;
  $("#view").innerHTML=h;
  $("#pm").onclick=()=>{S.calM--;if(S.calM<0){S.calM=11;S.calY--}renderCal()};
  $("#nm").onclick=()=>{S.calM++;if(S.calM>11){S.calM=0;S.calY++}renderCal()};
}

/* ---------- gallery ---------- */
/* calendar: finished work shows its final image, work in progress its latest rough/draft */
function calThumb(c){return DONE.has(c.status)?cover(c):latest(c)}
function cover(c){const im=c.images||[];const f=im.find(x=>x.kind==="완성본")||im[im.length-1];return f?f.id:null}

/* card caption: type / date, then before price / difference / after price */
const man=won;
function capLines(c,V){
  const type=c.subtype||c.type||"타입 없음";
  const date=V==="wip"?(c.due?`${md(c.due)} 마감 · ${ddLbl(dday(c.due))}`:"마감일 없음"):(c.doneDate?md(c.doneDate):"완료일 없음");
  const b=recv(c),a=c.quoteAfter??null;
  const has=b!=null&&a!=null;const d=has?a-b:null;
  const diff=d==null?"–":d===0?"±₩0":(d>0?"+":"−")+won(Math.abs(d));
  const dc=d>0?"var(--ok)":d<0?"var(--bad)":"var(--ink-2)";
  const df=V==="wip"?"due":"doneDate";
  return `<small class="l1"><span class="ed" data-ed="subtype" title="눌러서 수정">${esc(c.subtype||"타입 없음")}</span><span class="num ed" data-ed="${df}" title="눌러서 수정">${esc(date)}</span></small>
    <small class="l2 num"><span class="ed" data-ed="quoteBefore" title="작업 전 가격 · 눌러서 수정">${man(b)}</span><span style="color:${dc};font-weight:600">${diff}</span><span class="ed" data-ed="quoteAfter" title="작업 후 가격 · 눌러서 수정">${man(a)}</span></small>`;
}
const priceOf=c=>Number(c.quoteAfter)||recv(c)||0;   // price groups use 작업 후 가격 (falls back to 작업 전 when it is empty)
function latest(c){const im=(c.images||[]).filter(x=>x.kind!=="레퍼런스");const f=im[im.length-1]||(c.images||[])[0];return f?f.id:null}
/* finished = sent to the client; in progress = still being worked on (rough / draft stage) */
const hasFinal=c=>(c.images||[]).some(x=>x.kind==="완성본");
const isDone=c=>DONE.has(c.status);
const isWip=c=>!CANCEL.has(c.status)&&!isDone(c);
function stage(c){const im=(c.images||[]).filter(x=>x.kind!=="레퍼런스");
  if(hasFinal(c))return"완성본";if(im.some(x=>x.kind==="시안"))return"시안";if(im.some(x=>x.kind==="러프"))return"러프";return c.status}
function renderGal(){
  const V=S.galV||"done";

  let list=V==="wip"?wipAll:doneAll;
  /* work-time order: finished = most recently finished first; in progress = nearest deadline first */
  /* finished work: by completion date, newest first; entries without one follow, newest deadline first */
  const desc=(x,y)=>x>y?-1:x<y?1:0;
  list=[...list].sort(V==="wip"?((a,b)=>((a.due||"9")<(b.due||"9")?-1:(a.due||"9")>(b.due||"9")?1:0)||byDayOrder(a,b))
    :((a,b)=>(!!b.doneDate-!!a.doneDate)||desc(a.doneDate||"",b.doneDate||"")||byDayOrder(a,b)||desc(a.due||"",b.due||"")||(b.order||0)-(a.order||0)));

  let h=`<div class="seg" role="tablist" style="margin-top:0.875rem"><button type="button" role="tab" data-gv="done" aria-selected="${V==="done"}">상영 중 <span class="num">${doneAll.length}</span></button><button type="button" role="tab" data-gv="wip" aria-selected="${V==="wip"}">상영 예정 · 시안 <span class="num">${wipAll.length}</span></button></div>`;

  const tile=c=>{const id=V==="wip"?latest(c):cover(c);const n=(c.images||[]).length;const st=stage(c);
    return `<div class="tile" role="button" tabindex="0" style="--r:${ratioOf(c,id)}" data-open="${c.id}" data-dk="${esc((V==="wip"?c.due:c.doneDate)||"")}">${id?`<img class="pic" draggable="false" data-aid="${id}" src="${imgSrc(thumbId(c,id))}" alt="${esc(c.nick)} 작업물" loading="lazy">`:`<span class="ph">${V==="wip"?"아직 올린 시안 없음":"이미지 없음"}</span>`}
    <span class="cap"><strong>${esc(c.nick)}</strong>${capLines(c,V)}</span></div>`};
  h+=`<div class="rowtrack" style="margin-top:0.625rem"><button type="button" class="chip" data-gs="time" aria-pressed="${SO==="time"}">${V==="wip"?"마감 순":"작업 순"}</button><button type="button" class="chip" data-gs="price" aria-pressed="${SO==="price"}">가격대별</button><button type="button" class="chip" data-gs="type" aria-pressed="${SO==="type"}">타입별</button></div>`;

    else if(!S.galType){
      h+=`<h2 class="sec">타입별 폴더<span class="meta">${keys.length}개</span></h2><div class="folders">${keys.map(k=>{const g=groups.get(k);
        const covers=g.map(c=>{const id=V==="wip"?latest(c):cover(c);return id?thumbId(c,id):null}).filter(Boolean).slice(0,3);
        return `<button type="button" class="folder" data-gt="${esc(k)}"><span class="fcov">${covers.length?covers.map(id=>`<img src="${imgSrc(id)}" alt="" loading="lazy">`).join(""):`<i>이미지 없음</i>`}</span><span class="fname"><b>${esc(k)}</b><small>${g.length}건</small></span></button>`}).join("")}</div>`}

    $("#view").innerHTML=h;layoutGal();wireBulk();return}
  if(SO==="time"){
    if(!list.length)h+=`<div class="empty" style="margin-top:1rem">${V==="wip"?"상영 예정인 커미션이 없어요.":"상영 중인 작품이 아직 없어요."}</div>`;
    else if(V==="wip")h+=`<h2 class="sec">상영 예정<span class="meta">${list.length}건 · 마감 가까운 순</span></h2><div class="gal">${list.map(tile).join("")}</div>`;

/* justified gallery: rows sized so 3 portrait posters (2 on phones) fill a row; each row is scaled to the exact width */
function layoutGal(){document.querySelectorAll(".gal").forEach(g=>{
  const W=g.clientWidth-1;if(W<=0)return;
  const gap=parseFloat(getComputedStyle(g).columnGap)||10;
  const cols=W<560?2:Math.max(3,Math.min(5,Math.round(W/260)));const target=((W-gap*(cols-1))/cols)/.719;
  const tiles=[...g.children].filter(t=>t.classList.contains("tile"));
  const r=t=>parseFloat(t.style.getPropertyValue("--r"))||.719;
  const place=(row,h)=>row.forEach(t=>{t.style.width=(r(t)*h).toFixed(2)+"px"});
  let row=[],sum=0;
  tiles.forEach((t,i)=>{row.push(t);sum+=r(t);
    const full=(W-gap*(row.length-1))/sum<=target*1.08;   // row is full once it is no taller than ~the target height
    if(full){place(row,(W-gap*(row.length-1))/sum);row=[];sum=0}});
  if(row.length){let h=(W-gap*(row.length-1))/sum;if(h>target*1.6)h=target;place(row,h)}
})}

  const r=im.naturalWidth/im.naturalHeight;const id=im.dataset.aid;if(id)RATIO.set(id,r);
  const t=im.closest(".tile");if(t){t.style.setProperty("--r",Math.min(3,Math.max(.33,r)).toFixed(3));layoutGalSoon()}},true);

/* thumbnails: every upload also gets a small WebP copy for the poster wall / folders / sheet grid; the original stays for full view and backup */
const THUMB_MAX=960;
async function makeThumb(blob){try{const b=await createImageBitmap(blob);const k=Math.min(1,THUMB_MAX/Math.max(b.width,b.height));
  const cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(b.width*k));cv.height=Math.max(1,Math.round(b.height*k));
  cv.getContext("2d").drawImage(b,0,0,cv.width,cv.height);b.close&&b.close();
  const out=await new Promise(r=>cv.toBlob(r,"image/webp",.82));return out&&out.size<blob.size?out:null}catch(e){return null}}

const norm=s=>String(s||"").normalize("NFC").toLowerCase().replace(/\.[a-z0-9]+$/,"").replace(/님|커미션|commission/g,"").replace(/[\s_\-.()\[\]·,#]+/g,"");

const PRESETS=[["마키 골드","#e8b64c"],["스크린 레드","#c8102e"],["네온 시안","#3fd0e0"],["핑크","#e2437a"],["코랄","#ef6a4c"],["오렌지","#e8891a"],["머스타드","#c9a000"],["라임","#7cb518"],["그린","#1f9d55"],["민트","#14a89a"],["스카이","#1a9be0"],["코발트","#2f5bd3"],["퍼플","#7c4ddc"],["버건디","#a3233f"],["차콜","#2b3140"]];
const HEX=/^#[0-9a-f]{6}$/i;
function lum(hex){const n=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4);return .2126*n[0]+.7152*n[1]+.0722*n[2]}
try{if(window.parent!==window)new MutationObserver(function(){if(S.mode==="system")applyTheme(S.accent,"system")}).observe(window.parent.document.documentElement,{attributes:true,attributeFilter:["data-theme"]})}catch(e){}
try{matchMedia("(prefers-color-scheme: light)").addEventListener("change",function(){if(S.mode==="system")applyTheme(S.accent,"system")})}catch(e){}
function applyTheme(accent,mode){
  const r=document.documentElement;
  if(accent&&HEX.test(accent)){r.style.setProperty("--pink",accent);r.style.setProperty("--pink-soft",`color-mix(in srgb, ${accent} 16%, var(--sheet))`);r.style.setProperty("--on-accent",lum(accent)>.45?"#1d2433":"#ffffff")}
  else{["--pink","--pink-soft","--on-accent"].forEach(p=>r.style.removeProperty(p))}
  if(mode==="auto"||!mode)mode="system";
  S.accent=accent||"";S.mode=mode;
  const sysT=()=>{try{const t=window.parent.document.documentElement.getAttribute("data-theme");if(t==="light"||t==="dark")return t}catch(e){}return matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"};
  const eff=mode==="system"?sysT():mode;
  if(eff==="light"||eff==="dark")r.setAttribute("data-theme",eff);
  store("theme",JSON.stringify({accent:S.accent,mode:S.mode,status:S.statusColors||{}}));
}

.steps button[data-st="${k}"][aria-pressed="true"]{background:${v};border-color:${v};color:${lum(v)>.45?"#1d2433":"#fff"}}`}).join("\n");

function renderStats(){
  const done=S.c.filter(c=>DONE.has(c.status));
  const priced=done.filter(c=>recv(c)>0);
  const total=priced.reduce((a,c)=>a+net(c),0);
  const avg=priced.length?Math.round(priced.reduce((a,c)=>a+recv(c),0)/priced.length):null;
  const both=S.c.filter(c=>!CANCEL.has(c.status)&&recv(c)!=null&&c.quoteAfter!=null);
  const dOf=c=>c.quoteAfter-recv(c);
  const avgDiff=both.length?Math.round(both.reduce((a,c)=>a+dOf(c),0)/both.length):null;
  const sign=v=>v==null?"–":v===0?"±₩0":(v>0?"+":"−")+won(Math.abs(v));
  // monthly revenue by completion month, last 12 months that have data
  const by={};done.forEach(c=>{if(!c.doneDate)return;const k=c.doneDate.slice(0,7);(by[k]=by[k]||{v:0,n:0});by[k].v+=net(c);by[k].n++});
  const months=Object.keys(by).sort().slice(-12);
  // type table
  const T={};
  /* 타입 = ①심플 ~ ④번외; jobs without one are left out of the table */
  S.c.filter(c=>!CANCEL.has(c.status)&&c.subtype).forEach(c=>{(T[c.subtype]=T[c.subtype]||[]).push(c)});
  const avgOf=(arr,f)=>{const v=arr.map(f).filter(x=>x!=null&&!isNaN(x));return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null};
  const rows=Object.entries(T).map(([k,g])=>({k,n:g.length,b:avgOf(g,recv),a:avgOf(g,c=>c.quoteAfter),d:avgOf(g.filter(c=>recv(c)!=null&&c.quoteAfter!=null),dOf)})).sort((x,y)=>y.n-x.n);
  let h=`<div class="kpis">
    <div><small>누적 수익</small><b class="num">${won(total)}</b><span>상영 중 ${done.length}편 · 수수료 제외</span></div>
    <div><small>평균 단가</small><b class="num">${won(avg)}</b><span>가격 있는 ${priced.length}편 기준</span></div>
    <div><small>평균 차액</small><b class="num">${sign(avgDiff)}</b><span>작업 전 → 작업 후 · ${both.length}편</span></div></div>`;
  h+=`<h2 class="sec">월별 수익<span class="meta">완료일 기준 · 수수료 제외</span></h2>`;
  h+=months.length?`<div class="mchart" id="mchart">${monthChart(months.map(k=>({k,...by[k]})))}</div><div id="mlist"></div>`:`<div class="empty">완료일이 있는 작업이 아직 없어요.</div>`;
  if(!S.statMonth||!by[S.statMonth])S.statMonth=months[months.length-1];
  $("#view").innerHTML=h;wireChart();
}
function monthChart(data){
  const W=720,H=240,pl=8,pr=8,pt=26,pb=28;const max=Math.max(...data.map(d=>d.v),1);
  const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));const m=max/p;return (m<=2?2:m<=5?5:10)*p})();
  const iw=W-pl-pr,ih=H-pt-pb,bw=Math.min(56,iw/data.length*.62),step=iw/data.length;
  const y=v=>pt+ih-(v/nice)*ih;
  const grid=[.5,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${y(nice*f)}" y2="${y(nice*f)}" class="g"/><text x="${pl}" y="${y(nice*f)-5}" class="gl">${won(nice*f)}</text>`).join("");
  const best=data.reduce((a,d)=>d.v>a.v?d:a,data[0]);
  const bars=data.map((d,i)=>{const x=pl+step*i+(step-bw)/2,top=y(d.v),hgt=Math.max(0,pt+ih-top),r=Math.min(4,bw/2,hgt);
    const path=hgt>0?`M${x},${pt+ih}V${top+r}Q${x},${top} ${x+r},${top}H${x+bw-r}Q${x+bw},${top} ${x+bw},${top+r}V${pt+ih}Z`:"";
    return `<g class="bar" data-i="${i}" data-k="${d.k}" role="button" tabindex="0" aria-label="${Number(d.k.slice(5))}월 작업 보기" data-tip="${Number(d.k.slice(5))}월 · ${won(d.v)} · ${d.n}편"><rect x="${pl+step*i}" y="${pt}" width="${step}" height="${ih}" fill="transparent"/>${path?`<path d="${path}"/>`:""}
      ${d===best?`<text x="${x+bw/2}" y="${top-6}" class="vl">${won(d.v)}</text>`:""}
      <text x="${x+bw/2}" y="${H-8}" class="xl">${d.k.slice(2,4)==="26"?Number(d.k.slice(5))+"월":d.k.slice(2).replace("-",".")}</text></g>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 수익 막대 그래프">${grid}<line x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}" class="base"/>${bars}</svg><div class="tip" id="ctip" hidden></div>
  <details class="tblview"><summary>표로 보기</summary><table class="stbl"><thead><tr><th>월</th><th>수익</th><th>편수</th></tr></thead><tbody>${data.map(d=>`<tr data-k="${d.k}" class="mrow"><td>${d.k}</td><td class="num">${won(d.v)}</td><td class="num">${d.n}</td></tr>`).join("")}</tbody></table></details>`;
}

function startRo(){ro.active=true;ro.it.classList.add("reordering");document.body.classList.add("is-reordering");
  try{ro.it.setPointerCapture(ro.id)}catch(e){}
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}}

  const dist=Math.hypot(e.clientX-ro.x,e.clientY-ro.y);
  if(!ro.active){if(ro.touch){if(dist>8){clearTimeout(ro.timer);ro=null}return}if(dist<6)return;startRo()}
  e.preventDefault();

    const r=over.getBoundingClientRect();const horiz=r.width>=r.height*.6&&ro.box.classList.contains("gal");
    const after=horiz?(e.clientX>r.left+r.width/2):(e.clientY>r.top+r.height/2);
